<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#182545",
              "on-secondary-container": "#2c5e7f",
              "primary-container": "#2e3b5c",
              "surface-bright": "#fbf9f9",
              "surface-container-high": "#e9e8e7",
              "on-primary-container": "#99a6cc",
              "on-background": "#1b1c1c",
              "inverse-on-surface": "#f2f0f0",
              "surface-container-low": "#f5f3f3",
              "surface-tint": "#515e81",
              "secondary": "#316384",
              "on-secondary-fixed-variant": "#134b6b",
              "tertiary-container": "#3c3c3c",
              "on-tertiary": "#ffffff",
              "on-error": "#ffffff",
              "on-primary-fixed-variant": "#394668",
              "error": "#ba1a1a",
              "surface-variant": "#e3e2e2",
              "on-tertiary-container": "#a7a6a6",
              "secondary-fixed": "#c9e6ff",
              "surface-container-lowest": "#ffffff",
              "on-primary": "#ffffff",
              "error-container": "#ffdad6",
              "secondary-fixed-dim": "#9cccf1",
              "tertiary-fixed-dim": "#c8c6c6",
              "surface-dim": "#dbdad9",
              "on-secondary": "#ffffff",
              "surface-container-highest": "#e3e2e2",
              "on-surface-variant": "#45464e",
              "background": "#fbf9f9",
              "primary-fixed": "#dae2ff",
              "tertiary-fixed": "#e4e2e2",
              "inverse-primary": "#b9c6ee",
              "surface-container": "#efeded",
              "on-surface": "#1b1c1c",
              "on-tertiary-fixed": "#1b1c1c",
              "on-error-container": "#93000a",
              "surface": "#fbf9f9",
              "secondary-container": "#a7d7fd",
              "tertiary": "#262627",
              "primary-fixed-dim": "#b9c6ee",
              "on-tertiary-fixed-variant": "#474747",
              "outline-variant": "#c5c6cf",
              "on-primary-fixed": "#0c1a3a",
              "inverse-surface": "#303031",
              "outline": "#75777f",
              "on-secondary-fixed": "#001e2f"
            },
            fontFamily: {
              "headline": ["Inter"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .signature-gradient {
            background: linear-gradient(135deg, #182545 0%, #2e3b5c 100%);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- Subtle Background Elements -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute -top-[10%] -right-[5%] w-[40%] h-[40%] bg-secondary-container/20 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -left-[5%] w-[30%] h-[30%] bg-primary-fixed/30 rounded-full blur-[100px]"></div>
</div>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-6 z-10">
<div class="w-full max-w-md">
<!-- Logo Section -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl signature-gradient text-on-primary mb-4 shadow-xl shadow-primary/10">
<span class="material-symbols-outlined text-4xl" data-icon="description">description</span>
</div>
<h1 class="text-2xl font-bold font-headline tracking-tight text-primary">Informes de Predicación</h1>
<p class="text-on-surface-variant mt-2 text-sm">Ingresa a tu cuenta para continuar</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-8 border border-outline-variant/10">
<form class="space-y-6">
<!-- Email Field -->
<div>
<label class="block text-sm font-semibold text-primary mb-2 ml-1" for="email">Correo electrónico</label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg bg-surface-container-low border border-outline-variant/20 focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all outline-none text-on-surface" id="email" name="email" placeholder="tu@ejemplo.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2 ml-1">
<label class="text-sm font-semibold text-primary" for="password">Contraseña</label>
<a class="text-xs font-medium text-secondary hover:underline transition-all" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative">
<input class="w-full px-4 py-3 rounded-lg bg-surface-container-low border border-outline-variant/20 focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all outline-none text-on-surface" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-3.5 px-6 rounded-lg signature-gradient text-on-primary font-bold text-sm tracking-wide shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Ingresar</span>
<span class="material-symbols-outlined text-lg" data-icon="login">login</span>
</button>
</form>
<!-- Divider -->
<div class="mt-8 pt-6 border-t border-outline-variant/10 text-center">
<p class="text-sm text-on-surface-variant">
                        ¿No tienes una cuenta? 
                        <a class="text-secondary font-bold hover:underline" href="#">Contacta a tu secretario</a>
</p>
</div>
</div>
<!-- Secondary Action / Language -->
<div class="mt-8 flex justify-center items-center gap-4 text-xs font-medium text-on-surface-variant">
<button class="flex items-center gap-1 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="language">language</span>
                    Español
                </button>
<span class="text-outline-variant">•</span>
<button class="hover:text-primary transition-colors">Ayuda</button>
<span class="text-outline-variant">•</span>
<button class="hover:text-primary transition-colors">Privacidad</button>
</div>
</div>
</main>
<!-- Footer -->
<footer class="p-8 text-center z-10">
<div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-surface-container-high/50 backdrop-blur-sm">
<span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
<span class="text-[10px] uppercase tracking-[0.15em] font-bold text-on-surface-variant">Redeemer Church</span>
</div>
</footer>
</body></html>

<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-dim": "#6a4d30",
              "surface-container-highest": "#e2e3db",
              "primary-fixed": "#e5e1e7",
              "error": "#9f403d",
              "on-background": "#30332e",
              "inverse-on-surface": "#9e9d99",
              "tertiary-fixed": "#ffd5af",
              "on-primary": "#fbf6fc",
              "outline-variant": "#b1b3ab",
              "primary-container": "#e5e1e7",
              "secondary-fixed": "#ffdbcf",
              "on-error-container": "#752121",
              "primary": "#605d62",
              "on-tertiary-fixed": "#50361b",
              "on-primary-container": "#535155",
              "on-surface-variant": "#5d605a",
              "surface-container-high": "#e8e9e2",
              "surface-dim": "#d9dbd2",
              "error-dim": "#4e0309",
              "primary-fixed-dim": "#d7d3d8",
              "inverse-primary": "#faf5fb",
              "surface-container": "#eeeee8",
              "surface-variant": "#e2e3db",
              "on-secondary-fixed": "#66301a",
              "surface-tint": "#605d62",
              "on-surface": "#30332e",
              "on-tertiary-fixed-variant": "#6f5234",
              "surface": "#fbf9f5",
              "surface-container-low": "#f5f4ef",
              "inverse-surface": "#0e0e0d",
              "tertiary-container": "#ffd5af",
              "tertiary": "#77593b",
              "background": "#fbf9f5",
              "surface-bright": "#fbf9f5",
              "surface-container-lowest": "#ffffff",
              "on-secondary": "#fff7f5",
              "secondary": "#8c4f37",
              "error-container": "#fe8983",
              "secondary-container": "#ffdbcf",
              "on-error": "#fff7f6",
              "on-primary-fixed": "#403f43",
              "tertiary-fixed-dim": "#f0c8a2",
              "on-secondary-container": "#7c422b",
              "on-primary-fixed-variant": "#5d5b5f",
              "outline": "#797c75",
              "on-tertiary": "#fff7f3",
              "secondary-fixed-dim": "#ffc8b5",
              "secondary-dim": "#7e432c",
              "primary-dim": "#535256",
              "on-secondary-fixed-variant": "#884b33",
              "on-tertiary-container": "#65492c"
            },
            fontFamily: {
              "headline": ["Noto Serif"],
              "body": ["Manrope"],
              "label": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #fbf9f5;
            color: #30332e;
        }
        .serif-text {
            font-family: 'Noto Serif', serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-surface">
<div class="w-full max-w-sm space-y-12">
<!-- Minimal Branding -->
<header class="text-center">
<h1 class="serif-text text-4xl font-bold tracking-tight text-on-surface">
                Informes de <span class="italic text-secondary">Predicación</span>
</h1>
</header>
<!-- Simplified Main Card -->
<main class="bg-surface-container-lowest p-8 md:p-10 rounded-2xl shadow-sm border border-outline-variant/20">
<form action="#" class="space-y-8">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant/60 ml-1" for="email">Correo Electrónico</label>
<input class="w-full px-4 py-3.5 rounded-xl bg-transparent border border-outline-variant/30 focus:border-primary focus:ring-0 transition-all text-on-surface placeholder:text-on-surface-variant/30 text-sm" id="email" placeholder="email@ejemplo.com" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant/60" for="password">Contraseña</label>
</div>
<input class="w-full px-4 py-3.5 rounded-xl bg-transparent border border-outline-variant/30 focus:border-primary focus:ring-0 transition-all text-on-surface placeholder:text-on-surface-variant/30 text-sm" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Primary Submit Button -->
<button class="w-full bg-primary text-on-primary font-body font-semibold py-4 rounded-xl hover:bg-primary-dim transition-colors flex items-center justify-center" type="submit">
<span>Ingresar</span>
</button>
</form>
</main>
<!-- Simple Footer Footer -->
<footer class="text-center">
<p class="serif-text italic text-on-surface-variant/40 text-sm">Redeemer Church</p>
</footer>
</div>
</body></html>
